name: Remote Chrome site check
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Website URL to open in Chrome
        required: true
        default: https://graceplanner.vercel.app/
permissions:
  contents: read
jobs:
  open-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright and Chrome
        run: |
          npm init -y
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Open site in remote Chrome
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1440,height:1000},deviceScaleFactor:1});
          const response = await page.goto(process.env.TARGET_URL,{waitUntil:'domcontentloaded',timeout:90000});
          await page.screenshot({path:'remote-site.png',fullPage:true});
          console.log(JSON.stringify({url:page.url(),title:await page.title(),status:response?.status(),screenshot:'remote-site.png'}));
          await browser.close();
          if (!response || response.status() >= 400) process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-chrome-screenshot
          path: remote-site.png
          retention-days: 1
